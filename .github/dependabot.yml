version: 2
registries:
  filament:
    type: composer-repository
    url: https://packages.filamentphp.com/composer
    username: ${{secrets.FILAMENT_USERNAME}}
    password: ${{secrets.FILAMENT_PASSWORD}}
updates:
  # Only here so security updates can reach the private registries.
  # 0 turns version updates off; security PRs have their own limit.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    registries: "*"
